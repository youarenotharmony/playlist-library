<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Каталог плейлистов с Comprehensible Input для изучения английского."
    data-i18n-content="meta.description"
  >

  <meta name="theme-color" content="#f8f7fb">

  <title data-i18n="page.title">
    English CI Playlists
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./styles.css?v=12">
</head>

<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 6h12M8 12h12M8 18h12"/>
      <circle cx="4" cy="6" r="1"/>
      <circle cx="4" cy="12" r="1"/>
      <circle cx="4" cy="18" r="1"/>
    </symbol>

    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/>
    </symbol>

    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="m8 12 2.6 2.6L16.5 9"/>
    </symbol>

    <symbol id="icon-eye-off" viewBox="0 0 24 24">
      <path d="M3 3l18 18M10.7 10.8a2 2 0 0 0 2.5 2.5M9.7 4.3A10.8 10.8 0 0 1 12 4c5.5 0 9 8 9 8a15.5 15.5 0 0 1-2.2 3.3M6.6 6.6C4.2 8.4 3 12 3 12s3.5 8 9 8a9.7 9.7 0 0 0 4-.9"/>
    </symbol>

    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M3 12s3.5-8 9-8 9 8 9 8-3.5 8-9 8-9-8-9-8Z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </symbol>

    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>

    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m8 10 4 4 4-4"/>
    </symbol>

    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </symbol>

    <symbol id="icon-video" viewBox="0 0 24 24">
      <rect x="3" y="6" width="13" height="12" rx="2"/>
      <path d="m16 10 5-3v10l-5-3"/>
    </symbol>

    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M20.4 14.5A8.5 8.5 0 0 1 9.5 3.6a8.5 8.5 0 1 0 10.9 10.9Z"/>
    </symbol>

    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>

    <symbol id="icon-reset" viewBox="0 0 24 24">
      <path d="M4 4v6h6M5.5 15a7 7 0 1 0 .5-7.5L4 10"/>
    </symbol>

    <symbol id="icon-microphone" viewBox="0 0 24 24">
      <rect x="9" y="2.5" width="6" height="12" rx="3"/>
      <path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4M9 21h6"/>
    </symbol>
  </svg>

  <main class="page">
    <header class="top-controls">
      <nav
        class="view-tabs"
        aria-label="Разделы каталога"
        data-i18n-aria-label="navigation.sections"
      >
        <button
          class="view-tab is-active"
          type="button"
          data-view="all"
        >
          <svg aria-hidden="true">
            <use href="#icon-list"></use>
          </svg>

          <span data-i18n="tabs.all">Все</span>
          <b id="countAll">0</b>
        </button>

        <button
          class="view-tab"
          type="button"
          data-view="favorites"
        >
          <svg aria-hidden="true">
            <use href="#icon-heart"></use>
          </svg>

          <span data-i18n="tabs.favorites">
            Избранное
          </span>

          <b id="countFavorites">0</b>
        </button>

        <button
          class="view-tab"
          type="button"
          data-view="watched"
        >
          <svg aria-hidden="true">
            <use href="#icon-check"></use>
          </svg>

          <span data-i18n="tabs.watched">
            Просмотренные
          </span>

          <b id="countWatched">0</b>
        </button>

        <button
          class="view-tab"
          type="button"
          data-view="hidden"
        >
          <svg aria-hidden="true">
            <use href="#icon-eye-off"></use>
          </svg>

          <span data-i18n="tabs.hidden">
            Скрытые
          </span>

          <b id="countHidden">0</b>
        </button>

        <button
          class="view-tab special-filter-tab new-filter-tab"
          id="newFilterButton"
          type="button"
          aria-pressed="false"
          aria-label="Показывать только новые плейлисты"
          data-i18n-aria-label="filters.newOnlyLabel"
        >
          <span data-i18n="tabs.new">
            Новые
          </span>
        </button>

        <button
          class="view-tab special-filter-tab podcast-filter-tab"
          id="podcastFilterButton"
          type="button"
          aria-pressed="false"
          aria-label="Показывать только подкасты"
          data-i18n-aria-label="filters.podcastOnlyLabel"
        >
          <svg aria-hidden="true">
            <use href="#icon-microphone"></use>
          </svg>

          <span data-i18n="tabs.podcasts">
            Подкасты
          </span>
        </button>
      </nav>

      <div class="header-actions">
        <button
          class="round-button language-button"
          id="languageButton"
          type="button"
          aria-label="Switch to English"
          title="Switch to English"
        >
          <span
            class="language-button-text"
            id="languageButtonText"
          >
            EN
          </span>
        </button>

        <button
          class="round-button theme-button"
          id="themeButton"
          type="button"
          aria-label="Сменить тему"
          title="Сменить тему"
          data-i18n-aria-label="theme.toggle"
          data-i18n-title="theme.toggle"
        >
          <svg class="icon-for-light" aria-hidden="true">
            <use href="#icon-moon"></use>
          </svg>

          <svg class="icon-for-dark" aria-hidden="true">
            <use href="#icon-sun"></use>
          </svg>
        </button>
      </div>
    </header>

    <section
      class="filter-bar"
      aria-label="Поиск, фильтры и сортировка"
      data-i18n-aria-label="filters.section"
    >
      <label class="search-control">
        <svg aria-hidden="true">
          <use href="#icon-search"></use>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Поиск плейлиста"
          data-i18n-placeholder="search.placeholder"
          autocomplete="off"
          aria-label="Поиск плейлиста"
          data-i18n-aria-label="search.label"
        >

        <button
          id="clearSearchButton"
          type="button"
          aria-label="Очистить поиск"
          title="Очистить поиск"
          data-i18n-aria-label="search.clear"
          data-i18n-title="search.clear"
        >
          <svg aria-hidden="true">
            <use href="#icon-x"></use>
          </svg>
        </button>
      </label>

      <label class="select-control">
        <select
          id="levelFilter"
          aria-label="Фильтр по уровню"
          data-i18n-aria-label="filters.levelLabel"
        >
          <option
            value="all"
            data-i18n="filters.allLevels"
          >
            Все уровни
          </option>
        </select>

        <svg aria-hidden="true">
          <use href="#icon-chevron"></use>
        </svg>
      </label>

      <label class="select-control">
        <select
          id="accentFilter"
          aria-label="Фильтр по акценту"
          data-i18n-aria-label="filters.accentLabel"
        >
          <option
            value="all"
            data-i18n="filters.allAccents"
          >
            Все акценты
          </option>
        </select>

        <svg aria-hidden="true">
          <use href="#icon-chevron"></use>
        </svg>
      </label>

      <label class="select-control sort-control">
        <select
          id="sortSelect"
          aria-label="Сортировка"
          data-i18n-aria-label="sort.label"
        >
          <option
            value="duration-desc"
            data-i18n="sort.durationDesc"
          >
            Сначала длинные
          </option>

          <option
            value="duration-asc"
            data-i18n="sort.durationAsc"
          >
            Сначала короткие
          </option>

          <option
            value="title-asc"
            data-i18n="sort.titleAsc"
          >
            По алфавиту А–Я
          </option>

          <option
            value="title-desc"
            data-i18n="sort.titleDesc"
          >
            По алфавиту Я–А
          </option>

          <option
            value="videos-desc"
            data-i18n="sort.videosDesc"
          >
            Больше видео
          </option>

          <option
            value="videos-asc"
            data-i18n="sort.videosAsc"
          >
            Меньше видео
          </option>

          <option
            value="level-asc"
            data-i18n="sort.levelAsc"
          >
            По уровню
          </option>
        </select>

        <svg aria-hidden="true">
          <use href="#icon-chevron"></use>
        </svg>
      </label>

      <button
        class="round-button reset-button"
        id="resetFiltersButton"
        type="button"
        aria-label="Сбросить фильтры"
        title="Сбросить фильтры"
        data-i18n-aria-label="filters.reset"
        data-i18n-title="filters.reset"
      >
        <svg aria-hidden="true">
          <use href="#icon-reset"></use>
        </svg>
      </button>
    </section>

    <section
      class="catalog"
      aria-label="Каталог плейлистов"
      data-i18n-aria-label="catalog.label"
    >
      <div
        class="catalog-info"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="catalog-stat">
          <strong id="resultCount">0</strong>
          <span id="resultWord">плейлистов</span>
        </span>

        <span
          class="catalog-info-separator"
          aria-hidden="true"
        >
          ·
        </span>

        <span class="catalog-stat">
          <strong id="resultDuration">0</strong>
          <span id="resultDurationWord">часов</span>
        </span>
      </div>

      <div
        class="table-scroll"
        tabindex="0"
        aria-label="Прокручиваемая таблица плейлистов"
        data-i18n-aria-label="table.scrollLabel"
      >
        <div
          class="playlist-table"
          role="table"
          aria-label="Плейлисты"
          data-i18n-aria-label="table.label"
        >
          <div class="table-head" role="row">
            <span
              role="columnheader"
              data-i18n="table.playlist"
            >
              Плейлист
            </span>

            <span
              role="columnheader"
              data-i18n="table.level"
            >
              Уровень
            </span>

            <span
              role="columnheader"
              data-i18n="table.accent"
            >
              Акцент
            </span>

            <span
              role="columnheader"
              data-i18n="table.duration"
            >
              Длительность
            </span>

            <span
              role="columnheader"
              data-i18n="table.videos"
            >
              Видео
            </span>

            <span
              role="columnheader"
              data-i18n="table.actions"
            >
              Действия
            </span>
          </div>

          <div
            class="table-body"
            id="playlistRows"
          ></div>
        </div>
      </div>

      <div
        class="empty-state"
        id="emptyState"
        hidden
      >
        <svg aria-hidden="true">
          <use href="#icon-search"></use>
        </svg>

        <p data-i18n="empty.title">
          Ничего не найдено
        </p>

        <button
          id="emptyResetButton"
          type="button"
          data-i18n="filters.reset"
        >
          Сбросить фильтры
        </button>
      </div>
    </section>
  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script src="./data.js?v=12"></script>
  <script src="./app.js?v=12"></script>
</body>
</html>
